name: Android build setup
description: Install the JDK, Android SDK platform and Gradle caching used by every CI job.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # setup-android splits this on spaces, so a YAML block scalar arrives as one package name
        # containing newlines and sdkmanager fails with "Failed to find package".
        packages: platform-tools platforms;android-37.0 build-tools;37.0.0

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
